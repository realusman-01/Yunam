<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - Yunam</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; padding: 30px 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input { width: 100%; padding: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { width: 100%; padding: 12px; background: #38bdf8; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #0284c7; color: #fff; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; cursor: pointer; }
        .toggle-text span { color: #38bdf8; font-weight: bold; }
        .hidden { display: none; }
        #message { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; }
        .error { color: #f87171; }
        .success { color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="form-title">Login to Yunam</h2>
        
        <form id="auth-form">
            <!-- Username sirf signup ke waqt dikhega -->
            <div class="form-group hidden" id="username-group">
                <label>Username (e.g. usman)</label>
                <input type="text" id="username" placeholder="Choose a unique username">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="submit-btn">Login</button>
        </form>

        <div class="toggle-text" onclick="toggleForm()">
            <span id="toggle-msg">Don't have an account? Sign up</span>
        </div>

        <div id="message"></div>
    </div>

    <script>
        // ⚠️ YAHAN APNI SUPABASE DETAILS DAALO ⚠️
        const SUPABASE_URL = 'https://xrbhvjezfciqxcrllmha.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ICo6xHNT3T5MlPRNuEMqCw_98OvqwUM';

        // Initialize Supabase
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = true;
        const form = document.getElementById('auth-form');
        const usernameGroup = document.getElementById('username-group');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const toggleMsg = document.getElementById('toggle-msg');
        const messageDiv = document.getElementById('message');

        // Form toggle logic (Login vs Signup)
        function toggleForm() {
            isLoginMode = !isLoginMode;
            messageDiv.innerHTML = '';
            if (isLoginMode) {
                formTitle.innerText = 'Login to Yunam';
                submitBtn.innerText = 'Login';
                toggleMsg.innerText = "Don't have an account? Sign up";
                usernameGroup.classList.add('hidden');
                document.getElementById('username').required = false;
            } else {
                formTitle.innerText = 'Create an Account';
                submitBtn.innerText = 'Sign Up';
                toggleMsg.innerText = "Already have an account? Login";
                usernameGroup.classList.remove('hidden');
                document.getElementById('username').required = true;
            }
        }

        // Handle Form Submit
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageDiv.innerHTML = 'Please wait...';
            messageDiv.className = '';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value.toLowerCase().trim();

            if (isLoginMode) {
                // LOGIN LOGIC
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                
                if (error) {
                    messageDiv.innerText = error.message;
                    messageDiv.className = 'error';
                } else {
                    messageDiv.innerText = "Login successful! Redirecting...";
                    messageDiv.className = 'success';
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                }
            } else {
                // SIGNUP LOGIC
                if(username.includes(' ')) {
                    messageDiv.innerText = "Username mein space nahi ho sakta!";
                    messageDiv.className = 'error';
                    return;
                }

                // Signup with metadata (username goes to trigger automatically)
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { username: username }
                    }
                });

                if (error) {
                    messageDiv.innerText = error.message;
                    messageDiv.className = 'error';
                } else {
                    messageDiv.innerText = "Account created! Redirecting...";
                    messageDiv.className = 'success';
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                }
            }
        });

        // Check if user is already logged in on page load
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html'; // Agar pehle se login hai toh direct dashboard bhejo
            }
        }
        checkSession();
    </script>
</body>
</html>
