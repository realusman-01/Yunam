<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Yunam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="config.js"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(20, 27, 45, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --error: #ef4444;
            --success: #10b981;
            --nav-bg: rgba(15, 23, 42, 0.95);
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation; 
            -webkit-user-select: none; user-select: none; 
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.1), transparent 30%), radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.1), transparent 30%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px; 
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--border); padding: 15px 20px; border-radius: 15px;
            margin: 20px auto; max-width: 600px; width: calc(100% - 40px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: sticky; top: 10px; z-index: 100;
        }

        .logo { font-size: 20px; font-weight: 700; color: #818cf8; }
        .search-bar { flex: 1; margin: 0 15px; position: relative; }
        .search-bar input { width: 100%; padding: 8px 15px 8px 35px; border-radius: 20px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: white; font-size: 13px; outline: none;}
        .search-bar i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px;}

        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .view { display: none; animation: fadeIn 0.4s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card { background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); padding: 20px; border-radius: 20px; margin-bottom: 20px; }

        .category-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none;}
        .category-chips::-webkit-scrollbar { display: none; }
        .chip { padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.2s;}
        .chip.active { background: var(--primary); border-color: var(--primary); }
        
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 15px; overflow: hidden; display: flex; flex-direction: column; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; background: #000; }
        .product-info { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .product-info h4 { font-size: 14px; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-info .price { font-size: 16px; font-weight: 700; color: var(--success); margin-bottom: 10px; }
        .product-info .seller { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: auto; }
        .product-info .seller img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover;}

        .buy-btn { width: 100%; padding: 8px; background: rgba(99, 102, 241, 0.15); color: var(--primary); border: none; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; margin-top: 10px;}
        .buy-btn:active { background: var(--primary); color: white;}

        .settings-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar-upload { position: relative; width: 70px; height: 70px; border-radius: 50%; background: #1e293b; border: 2px solid var(--border); overflow: hidden; display: flex; justify-content: center; align-items: center;}
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload input { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .avatar-upload i { font-size: 24px; color: var(--text-muted); }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        input, textarea, select { width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); color: white; border-radius: 10px; font-size: 14px; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); }
        
        .btn-primary { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;}
        .btn-primary:active { transform: scale(0.98); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--nav-bg); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; padding: 5px 20px; transition: 0.3s; }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 350px; }
        .toast { background: #1e293b; color: #fff; padding: 15px 20px; border-radius: 10px; border-left: 4px solid var(--primary); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; animation: slideDown 0.3s ease forwards; }
        .toast.error { border-left-color: var(--error); } .toast.success { border-left-color: var(--success); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-10px); } }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #fff; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #141b2d; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; transform: scale(0.9); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-content h3 { margin-bottom: 10px; } .modal-content p { color: var(--text-muted); margin-bottom: 20px; font-size: 14px;}
        .modal-actions { display: flex; gap: 10px; }
        .btn-secondary { flex: 1; padding: 12px; background: rgba(255,255,255,0.1); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .btn-danger { flex: 1; padding: 12px; background: var(--error); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content">
            <h3 id="confirm-title">Are you sure?</h3>
            <p id="confirm-message">This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal('confirm-modal')">Cancel</button>
                <button class="btn-danger" id="confirm-yes-btn">Yes</button>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="logo">Yunam</div>
        <div class="search-bar" id="search-container" style="display: none;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search products..." onkeyup="handleSearch()">
        </div>
        <span id="nav-title" style="font-weight: 600; color: var(--text-muted); font-size: 14px;">Market</span>
    </div>

    <div class="container">
        
        <div id="home-view" class="view active">
            <div class="category-chips">
                <div class="chip active" onclick="filterCategory('All', this)">All</div>
                <div class="chip" onclick="filterCategory('Fashion', this)">Fashion</div>
                <div class="chip" onclick="filterCategory('Electronics', this)">Electronics</div>
                <div class="chip" onclick="filterCategory('Services', this)">Services</div>
                <div class="chip" onclick="filterCategory('Digital', this)">Digital</div>
            </div>
            <div class="product-grid" id="products-container"></div>
        </div>

        <div id="settings-view" class="view">
            
            <div class="glass-card">
                <h3 class="section-title" style="margin-bottom: 15px; font-size: 16px;"><i class="fa-solid fa-user-pen" style="color: var(--primary);"></i> Manage Yourself</h3>
                <div class="settings-header">
                    <div class="avatar-upload">
                        <img id="avatar-preview" src="" style="display:none;">
                        <i class="fa-solid fa-camera" id="avatar-icon"></i>
                        <input type="file" accept="image/*" onchange="uploadAvatar(event)">
                    </div>
                    <div class="user-info">
                        <h2 id="display-username" style="font-size: 16px;">Loading...</h2>
                        <p id="display-email" style="font-size: 12px; color: var(--text-muted);">Loading...</p>
                    </div>
                </div>

                <div class="form-group">
                    <label>Bio / About</label>
                    <textarea id="profile-bio" placeholder="Tell buyers about yourself..." maxlength="300" style="min-height: 60px;"></textarea>
                </div>
                <button class="btn-primary" onclick="updateProfile()" id="save-profile-btn">
                    <i class="fa-solid fa-floppy-disk"></i> Save Profile
                </button>
            </div>

            <div class="glass-card">
                <h3 class="section-title" style="margin-bottom: 15px; font-size: 16px;"><i class="fa-solid fa-box-open" style="color: var(--primary);"></i> Add Product</h3>
                
                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" id="product-image" accept="image/*" style="padding: 10px;">
                </div>
                <div class="form-group">
                    <label>Product Title</label>
                    <input type="text" id="product-title" placeholder="e.g. Nike Shoes (Original)">
                </div>
                <div class="form-group">
                    <label>Price (PKR)</label>
                    <input type="number" id="product-price" placeholder="e.g. 2500">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="product-category">
                        <option value="Fashion">Fashion</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Services">Services</option>
                        <option value="Digital">Digital</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="product-desc" placeholder="Details about the product..." style="min-height: 60px;"></textarea>
                </div>
                <button class="btn-primary" onclick="addProduct()" id="add-product-btn">
                    <i class="fa-solid fa-plus"></i> Add Product (COD Only)
                </button>
            </div>

            <div class="glass-card">
                <h3 class="section-title" style="margin-bottom: 15px; font-size: 16px;"><i class="fa-solid fa-list" style="color: var(--primary);"></i> My Products</h3>
                <div id="my-products-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>

            <button class="btn-danger" style="width: 100%; padding: 14px; font-size: 15px; margin-bottom: 20px;" onclick="confirmLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchView('home')">
            <i class="fa-solid fa-store"></i><span>Market</span>
        </div>
        <div class="nav-item" id="nav-settings" onclick="switchView('settings')">
            <i class="fa-solid fa-user-gear"></i><span>Settings</span>
        </div>
    </div>

    <script>
        let currentUser = null;
        let confirmCallback = null;
        let userProfile = null;
        let currentCategory = 'All';
        let searchQuery = '';

        function switchView(view) {
            document.getElementById('home-view').classList.remove('active');
            document.getElementById('settings-view').classList.remove('active');
            document.getElementById('nav-home').classList.remove('active');
            document.getElementById('nav-settings').classList.remove('active');
            document.getElementById('search-container').style.display = 'none';

            if(view === 'home') {
                document.getElementById('home-view').classList.add('active');
                document.getElementById('nav-home').classList.add('active');
                document.getElementById('nav-title').innerText = "Market";
                document.getElementById('search-container').style.display = 'block';
                loadProducts();
            } else {
                document.getElementById('settings-view').classList.add('active');
                document.getElementById('nav-settings').classList.add('active');
                document.getElementById('nav-title').innerText = "Settings";
                loadMyProducts();
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            let icon = type === 'error' ? 'fa-circle-exclamation' : (type === 'success' ? 'fa-circle-check' : 'fa-circle-info');
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function compressImage(file) {
            const options = { maxSizeMB: 0.2, maxWidthOrHeight: 800, useWebWorker: true };
            try { return await imageCompression(file, options); } catch (error) { return file; }
        }

        // 🔥 IMGBB UPLOAD FUNCTION (No Supabase Storage Used) 🔥
        async function uploadImage(file, path) {
            const compressed = await compressImage(file);
            const formData = new FormData();
            formData.append('image', compressed);
            
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (!data.success) throw new Error('Image upload failed');
            return data.data.url;
        }

        async function initDashboard() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUser = session.user;
            
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            if (profile) {
                userProfile = profile;
                document.getElementById('display-username').innerText = '@' + profile.username;
                document.getElementById('display-email').innerText = currentUser.email;
                if (profile.bio) document.getElementById('profile-bio').value = profile.bio;
                if (profile.avatar_url) {
                    document.getElementById('avatar-preview').src = profile.avatar_url;
                    document.getElementById('avatar-preview').style.display = 'block';
                    document.getElementById('avatar-icon').style.display = 'none';
                }
            } else {
                document.getElementById('display-username').innerText = '@' + (currentUser.user_metadata?.username || 'user');
                document.getElementById('display-email').innerText = currentUser.email;
            }
            
            switchView('home');
        }

        async function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '<div class="spinner" style="margin: 20px auto; grid-column: span 2;"></div>';

            let query = supabaseClient.from('products').select('*, profiles(username, avatar_url)').order('created_at', { ascending: false });
            if (currentCategory !== 'All') query = query.eq('category', currentCategory);
            if (searchQuery) query = query.ilike('title', `%${searchQuery}%`);

            const { data: products, error } = await query;
            if (error) { showToast("Failed to load products", "error"); return; }

            container.innerHTML = '';
            if (products.length === 0) {
                container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: var(--text-muted); padding: 20px;">No products found.</p>';
                return;
            }

            products.forEach(p => {
                const a = document.createElement('div');
                a.className = 'product-card';
                a.innerHTML = `
                    <img src="${p.image_url || 'https://via.placeholder.com/150'}" alt="${p.title}">
                    <div class="product-info">
                        <h4>${p.title}</h4>
                        <div class="price">Rs. ${p.price}</div>
                        <div class="seller">
                            <img src="${p.profiles?.avatar_url || 'https://via.placeholder.com/20'}">
                            <span>@${p.profiles?.username || 'user'}</span>
                        </div>
                        <button class="buy-btn" onclick="buyProduct('${p.title}', '${p.profiles?.username}')">Buy (COD)</button>
                    </div>
                `;
                container.appendChild(a);
            });
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            currentCategory = cat;
            loadProducts();
        }

        let searchTimeout;
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchQuery = document.getElementById('search-input').value;
                loadProducts();
            }, 500);
        }

        function buyProduct(productName, sellerUsername) {
            window.location.href = `/u/${sellerUsername}`;
            showToast("Opening seller profile to contact...", "info");
        }

        async function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;
            showToast("Uploading image...", "info");
            
            try {
                const url = await uploadImage(file, `avatars/${currentUser.id}`);
                await supabaseClient.from('profiles').update({ avatar_url: url }).eq('id', currentUser.id);
                
                document.getElementById('avatar-preview').src = url;
                document.getElementById('avatar-preview').style.display = 'block';
                document.getElementById('avatar-icon').style.display = 'none';
                showToast("Profile picture updated!", "success");
            } catch (e) {
                showToast("Upload failed: " + e.message, "error");
            }
        }

        async function updateProfile() {
            const bio = document.getElementById('profile-bio').value;
            const btn = document.getElementById('save-profile-btn');
            btn.innerHTML = '<div class="spinner"></div>';
            
            await supabaseClient.from('profiles').update({ bio: bio }).eq('id', currentUser.id);
            showToast("Profile saved!", "success");
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Profile';
        }

        async function addProduct() {
            const title = document.getElementById('product-title').value.trim();
            const price = document.getElementById('product-price').value;
            const cat = document.getElementById('product-category').value;
            const desc = document.getElementById('product-desc').value.trim();
            const file = document.getElementById('product-image').files[0];
            const btn = document.getElementById('add-product-btn');

            if (!title || !price) { showToast("Title and Price required!", "error"); return; }
            if (!file) { showToast("Please select an image!", "error"); return; }

            btn.innerHTML = '<div class="spinner"></div>';

            try {
                const imageUrl = await uploadImage(file, `products/${currentUser.id}`);
                
                const { error } = await supabaseClient.from('products').insert([{
                    seller_id: currentUser.id,
                    title: title,
                    price: parseFloat(price),
                    category: cat,
                    description: desc,
                    image_url: imageUrl
                }]);

                if (error) throw error;

                showToast("Product added successfully!", "success");
                document.getElementById('product-title').value = '';
                document.getElementById('product-price').value = '';
                document.getElementById('product-desc').value = '';
                document.getElementById('product-image').value = '';
                loadMyProducts();
            } catch (e) {
                showToast("Failed: " + e.message, "error");
            }
            btn.innerHTML = '<i class="fa-solid fa-plus"></i> Add Product (COD Only)';
        }

        async function loadMyProducts() {
            const list = document.getElementById('my-products-list');
            const { data: products } = await supabaseClient.from('products').select('*').eq('seller_id', currentUser.id).order('created_at', { ascending: false });
            
            list.innerHTML = '';
            if (!products || products.length === 0) {
                list.innerHTML = '<p style="font-size:12px; color:var(--text-muted);">No products added yet.</p>';
                return;
            }
            products.forEach(p => {
                list.innerHTML += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.2); padding:10px; border-radius:10px;">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img src="${p.image_url}" style="width:40px; height:40px; border-radius:5px; object-fit:cover;">
                            <div>
                                <h4 style="font-size:13px;">${p.title}</h4>
                                <span style="font-size:11px; color:var(--success);">Rs. ${p.price}</span>
                            </div>
                        </div>
                        <button class="action-btn delete" onclick="deleteProduct('${p.id}')" style="color:var(--error);"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            openConfirm("Delete Product", "Remove this product?", async () => {
                await supabaseClient.from('products').delete().eq('id', id);
                showToast("Deleted", "success");
                loadMyProducts();
            });
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function openConfirm(title, message, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            confirmCallback = callback;
            openModal('confirm-modal');
        }
        document.getElementById('confirm-yes-btn').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeModal('confirm-modal');
        });
        function confirmLogout() {
            openConfirm("Logout", "Are you sure you want to logout?", async () => {
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            });
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
