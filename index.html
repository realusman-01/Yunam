<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yunam - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #0b0f19; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #141b2d; padding: 40px 20px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        h1 { color: #818cf8; margin-bottom: 20px; }
        #error-box { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; font-size: 13px; display: none; margin-top: 20px; word-break: break-all; text-align: left; }
        .loading { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Yunam Login</h1>
        <div id="clerk-auth-container">
            <p class="loading">Loading secure login...</p>
        </div>
        <div id="error-box"></div>
    </div>

    <script>
        window.addEventListener('load', async function() {
            const container = document.getElementById('clerk-auth-container');
            const errorBox = document.getElementById('error-box');

            try {
                // 1. Apni Publishable Key yahan daalein
                const CLERK_PUBLISHABLE_KEY = 'pk_test_cmlnaHQtc2Vhc25haWwtMzE2MC5jbGVyay5hY2NvdW50cy5kZXYk';
                
                if (CLERK_PUBLISHABLE_KEY.includes('YAHAN')) {
                    throw new Error("Please enter your actual Clerk Publishable Key.");
                }

                // 2. Decode domain from key
                const clerkDomain = atob(CLERK_PUBLISHABLE_KEY.split('_')[2]).slice(0, -1);

                // 3. Load Clerk UI bundle first
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`;
                    script.async = true;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Failed to load Clerk UI bundle.'));
                    document.head.appendChild(script);
                });

                // 4. Load Clerk core JS with data attribute so it initializes window.Clerk
                await new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`;
                    script.async = true;
                    // 🔥 Yeh attribute window.Clerk initialize karne ke liye zaroori hai
                    script.setAttribute('data-clerk-publishable-key', CLERK_PUBLISHABLE_KEY);
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Failed to load Clerk SDK.'));
                    document.head.appendChild(script);
                });

                // 5. Double check if global variable exists
                if (typeof window.Clerk === 'undefined') {
                    throw new Error("Clerk script loaded but 'window.Clerk' was not created. Check browser console.");
                }

                // 6. Initialize Clerk with the UI constructor
                await window.Clerk.load({
                    ui: { ClerkUI: window.__internal_ClerkUICtor }
                });

                container.innerHTML = ''; // clear loading text

                // 7. Redirect if already logged in
                if (window.Clerk.user) {
                    container.innerHTML = "<p>Already logged in! Redirecting...</p>";
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                    return;
                }

                // 8. Mount Sign In UI
                window.Clerk.mountSignIn(container);

            } catch (error) {
                console.error("Clerk Initialization Error:", error);
                container.innerHTML = '';
                errorBox.style.display = 'block';
                errorBox.innerHTML = "<b>ERROR:</b> " + error.message;
            }
        });
    </script>
</body>
</html>
