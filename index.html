<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yunam - Login Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- 🔥 YAHAN APNI CLERK PUBLISHABLE KEY DAALO 🔥 -->
    <script 
        async 
        crossorigin="anonymous" 
        data-clerk-publishable-key="pk_test_cmlnaHQtc2Vhc25haWwtMzE2MC5jbGVyay5hY2NvdW50cy5kZXYk" 
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" 
        type="text/javascript">
    </script>
    
    <style>
        body { background-color: #0b0f19; color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #141b2d; padding: 40px 20px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        h1 { color: #818cf8; margin-bottom: 20px; }
        #error-box { color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; font-size: 13px; display: none; margin-top: 20px; word-break: break-all; text-align: left; }
        .loading { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Yunam Login</h1>
        <div id="clerk-auth-container">
            <p class="loading">Clerk load ho raha hai... (Wait karein)</p>
        </div>
        <!-- Error yahan show hoga -->
        <div id="error-box"></div>
    </div>

    <script>
        window.addEventListener('load', async function() {
            const container = document.getElementById('clerk-auth-container');
            const errorBox = document.getElementById('error-box');

            try {
                if (typeof window.Clerk === 'undefined') {
                    throw new Error("Clerk load nahi hua. Internet check karein ya ad-blocker band karein.");
                }

                await window.Clerk.load();
                container.innerHTML = ''; // Loading text hatao

                // Agar user pehle se login hai
                if (window.Clerk.user) {
                    container.innerHTML = "<p>Already logged in! Redirecting to dashboard...</p>";
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                    return;
                }

                // Login UI Mount karo
                window.Clerk.mountSignIn(container);

            } catch (error) {
                console.error(error);
                container.innerHTML = ''; // Loading text hatao
                errorBox.style.display = 'block';
                errorBox.innerHTML = "<b>ERROR:</b> " + error.message;
            }
        });
    </script>
</body>
</html>
